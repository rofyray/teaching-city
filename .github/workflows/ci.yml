name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: "true"
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
  CRON_SECRET: ci-cron-secret
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/teaching_city_test
  E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/teaching_city_e2e
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/teaching_city_test

jobs:
  checks:
    name: Typecheck, lint, unit tests, copy check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_city_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:copy
      - run: pnpm test

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_city_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        run: |
          if ls tests/e2e/*.spec.ts >/dev/null 2>&1; then
            pnpm test:e2e
          else
            echo "No end-to-end specs in this change yet"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
